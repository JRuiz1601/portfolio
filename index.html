<div class="navbar-wrap">

    <button class="nav-item active" data-idx="0" data-target="inicio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      <span class="nav-label" data-i18n="nav.inicio">Inicio</span>
    </button>
    <button class="nav-item" data-idx="1" data-target="experiencia">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
      <span class="nav-label" data-i18n="nav.experiencia">Experiencia</span>
    </button>
    <button class="nav-item" data-idx="2" data-target="proyectos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      <span class="nav-label" data-i18n="nav.proyectos">Proyectos</span>

<main>
<section class="hero" id="inicio" data-section>
  <div class="content">
    <div class="eyebrow" data-i18n="hero.eyebrow">Cali, Colombia — Ing. de Sistemas, Icesi</div>
    <h1 class="name">Juan Esteban<br>Ruiz Ome</h1>
    <div class="role" data-i18n="hero.rol">Agentes de IA, RAG y Desarrollo Backend</div>
    <div class="desc" data-i18n="hero.bio">
      Construyo sistemas que llegan a producción, no que se quedan en demo.
    </div>

    <div class="status-block">
      <span class="status-pill"><span class="live-dot"></span><span data-i18n="hero.estadoPill">Buscando práctica 2027-1</span></span>
      <span class="status-text" data-i18n="hero.estado">Estudiante de 9.º semestre.</span>
    </div>

    <div class="cta-row">
      <a class="btn btn-primary btn-icon" href="assets/hv-juan-esteban-ruiz-ome.pdf" download data-hv>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
        <span data-i18n="hero.ctaHv">Descargar HV</span>
      </a>
      <a class="btn btn-ghost" href="#proyectos" data-scroll-to="proyectos" data-i18n="hero.ctaProyectos">Ver proyectos</a>
      <a class="btn btn-ghost" href="#contacto" data-scroll-to="contacto" data-i18n="hero.ctaContacto">Contacto</a>
    </div>

    <div class="signals" id="signals"></div>
  </div>

  <div class="photo-wrap">
    <button class="photo-frame" type="button" id="pitchBtn" data-open-pitch>
      <span class="frame-reveal"></span>
      <img src="assets/me.png" alt="Juan Esteban Ruiz Ome">
      <span class="photo-play">
        <span class="photo-play-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg></span>
        <span class="photo-play-label" data-i18n="hero.verPitch">Ver mi pitch</span>
      </span>
    </button>
    <div class="corner-tag"><span class="live-dot"></span><span data-i18n="hero.fotoTag">Cali, CO</span></div>
  </div>

  <a class="scroll-hint" href="#experiencia" data-scroll-to="experiencia" aria-label="Experiencia">
    <span data-i18n="scrollHint">Desliza</span>
    <span class="scroll-hint-line"></span>
  </a>
</section>

<section class="section" id="experiencia" data-section></section>
<section class="section" id="proyectos" data-section></section>
<section class="section" id="stack" data-section></section>
<section class="section section-last" id="contacto" data-section></section>

  <figure class="lb-figure">
    <img id="lbImg" alt="">
    <figcaption id="lbCaption"></figcaption>
  </figure>
  <button class="lb-btn lb-next" id="lbNext" aria-label="Next">›</button>

<div class="video-modal" id="videoModal" role="dialog" aria-modal="true" aria-hidden="true">

</div>
