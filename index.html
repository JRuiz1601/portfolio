<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juan Esteban Ruiz Ome — Ingeniero de Software</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="lang-switch" id="langSwitch">
  <button class="lang-btn" data-lang="es">ES</button>
  <button class="lang-btn" data-lang="en">EN</button>
</div>

<div class="navbar-wrap">
  <nav class="navbar" id="navbar">
    <div class="nav-indicator" id="nav-indicator"></div>
    <button class="nav-item active" data-idx="0" data-panel="inicio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      <span class="nav-label" data-i18n="nav.inicio">Inicio</span>
    </button>
    <button class="nav-item" data-idx="1" data-panel="experiencia">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
      <span class="nav-label" data-i18n="nav.experiencia">Experiencia</span>
    </button>
    <button class="nav-item" data-idx="2" data-panel="proyectos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      <span class="nav-label" data-i18n="nav.proyectos">Proyectos</span>
    </button>
    <button class="nav-item" data-idx="3" data-panel="stack">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
      <span class="nav-label" data-i18n="nav.stack">Stack</span>
    </button>
    <button class="nav-item" data-idx="4" data-panel="contacto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" opacity="0"/><path d="M22 6l-10 7L2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
      <span class="nav-label" data-i18n="nav.contacto">Contacto</span>
    </button>
  </nav>
</div>

<div class="hero" id="hero">
  <div class="content">
    <div class="eyebrow" data-i18n="hero.eyebrow">Cali, Colombia — Ing. de Sistemas, Icesi</div>
    <h1 class="name">Juan Esteban<br>Ruiz Ome</h1>
    <div class="role" data-i18n="hero.rol">Ingeniero de Software — IA y Automatización</div>
    <div class="desc" data-i18n="hero.bio">
      Construyo sistemas que llegan a producción, no que se quedan en demo.
    </div>

    <div class="status-block">
      <span class="status-pill"><span class="live-dot"></span><span data-i18n="hero.estadoPill">Buscando práctica 2027-1</span></span>
      <span class="status-text" data-i18n="hero.estado">Estudiante de 9.º semestre.</span>
    </div>

    <div class="cta-row">
      <button class="btn btn-primary" data-open-panel="proyectos" data-i18n="hero.ctaProyectos">Ver proyectos</button>
      <a class="btn btn-ghost" href="assets/hv-juan-esteban-ruiz-ome.pdf" download data-i18n="hero.ctaHv">Descargar HV</a>
      <button class="btn btn-ghost" data-open-panel="contacto" data-i18n="hero.ctaContacto">Contacto</button>
    </div>

    <div class="signals" id="signals"></div>
  </div>

  <div class="photo-wrap">
    <div class="photo-frame">
      <span class="frame-reveal"></span>
      <img src="assets/me.png" alt="Juan Esteban Ruiz Ome">
    </div>
    <div class="corner-tag"><span class="live-dot"></span><span data-i18n="hero.fotoTag">Cali, CO</span></div>
  </div>
</div>

<div class="panel-backdrop" id="panelBackdrop"></div>
<div class="panel" id="panel" role="dialog" aria-modal="true">
  <button class="panel-close" id="panelClose" aria-label="Close">✕</button>
  <div class="panel-inner" id="panelInner"></div>
</div>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
