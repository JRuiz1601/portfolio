    <button class="nav-item" data-idx="2" data-target="proyectos">

<main>
<section class="hero" id="inicio" data-section>

    <h1 class="hello" data-i18n="hero.saludo">Hola, soy Juan Esteban.</h1>
    <p class="lead" data-i18n="hero.lead"></p>

    <div class="cta-row">
      <a class="btn btn-hv" href="../assets/hv-juan-esteban-ruiz-ome.pdf" download data-hv>
        <span class="btn-hv-sheet" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="btn-hv-text">
          <span class="btn-hv-title" data-i18n="hero.hvTitulo">Descargar mi HV</span>
          <span class="btn-hv-sub" data-i18n="hero.hvSub">PDF · 1 página · español</span>
        </span>
        <span class="btn-hv-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg></span>
      </a>
      <a class="btn btn-soft" href="#experiencia" data-scroll-to="experiencia">
        <span data-i18n="hero.ctaHistoria">Empieza la historia</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="m6 13 6 6 6-6"/></svg>

  <div class="portrait">
    <button class="portrait-disc" type="button" data-open-pitch>
      <span class="portrait-bg" aria-hidden="true"></span>
      <img src="img/me-cut.webp" alt="Juan Esteban Ruiz Ome">
      <span class="portrait-play">
        <span class="portrait-play-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg></span>
        <span data-i18n="hero.verPitch">Mi pitch</span>
      </span>
    </button>
  </div>

  <a class="scroll-hint" href="#manifiesto" aria-hidden="true" tabindex="-1">
    <span data-i18n="hero.scroll">Desliza</span>
    <span class="scroll-hint-dot"></span>
  </a>
</section>

<div class="marquee-band" aria-label="Stack">

</div>

  <p class="manifesto-text" id="manifestoText"></p>
  <div class="highlight-wrap" id="signals"></div>

</div>
